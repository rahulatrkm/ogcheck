[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ogcheck"
version = "1.0.0"
description = "Validate your Open Graph / social-preview tags and confirm og:image actually loads."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
# Zero runtime dependencies — pure standard library, so it deploys anywhere free.
dependencies = []

[project.scripts]
ogcheck = "ogcheck.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["ogcheck"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
# SEO/landing content is long-form HTML copy composed as multi-line strings;
# wrapping or parenthesizing it hurts readability with no real benefit.
"ogcheck/seo.py" = ["E501", "ISC004"]
# Network I/O legitimately treats any error as "unreachable" (broad by design).
"ogcheck/core.py" = ["BLE001"]
