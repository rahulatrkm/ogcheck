# Render.com free-tier deploy for OGCheck (native Python runtime, no Docker).
# In Render: New > Blueprint > connect this repo. Free, auto-deploys on push.
services:
  - type: web
    name: ogcheck
    runtime: python
    plan: free
    buildCommand: "pip install gunicorn"
    startCommand: "gunicorn --bind 0.0.0.0:$PORT --timeout 120 wsgi:app"
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
