# Render.com free-tier deploy for OGCheck.
# In Render: New > Blueprint > connect this repo. Free, auto-deploys on push.
services:
  - type: web
    name: ogcheck
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: PORT
        value: "8000"
